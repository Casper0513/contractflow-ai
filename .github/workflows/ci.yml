name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    env:
      CI: true
      HUSKY: 0
      DATABASE_URL: postgresql://contractflow:contractflow@localhost:5432/contractflow?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @contractflow/db generate

      - name: Build database package
        run: pnpm --filter @contractflow/db build

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Full dependency audit
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Build
        run: pnpm build
