services:
  postgres:
    image: postgres:17-alpine
    container_name: contractflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contractflow
      POSTGRES_PASSWORD: contractflow_dev_password
      POSTGRES_DB: contractflow
    ports:
      - "5432:5432"
    volumes:
      - contractflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractflow -d contractflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: contractflow-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "4444:4444"
    volumes:
      - contractflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contractflow_postgres_data:
  contractflow_redis_data:
